name: Deploy to AWS S3

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        env:
          VITE_APP_ONE_URL: ${{ vars.VITE_APP_ONE_URL }}
          VITE_APP_TWO_URL: ${{ vars.VITE_APP_TWO_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # Vite hashes every built JS/CSS filename by content, so those
      # files can be cached forever - a content change always ships
      # under a new name. --exclude here also keeps this sync's
      # --delete from touching index.html.
      - name: Sync hashed assets to S3 (long-lived cache)
        run: |
          aws s3 sync dist/ s3://bk-shell-bucket/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      # index.html is the SPA entry point every human-facing URL falls
      # back to (see README) and is NOT hashed, so it must never be
      # cached - it's what points browsers at the latest hashed assets.
      - name: Sync index.html to S3 (no cache)
        run: |
          aws s3 cp dist/index.html s3://bk-shell-bucket/index.html \
            --cache-control "no-cache"

      # Only index.html actually changes on every deploy, so only its
      # path needs invalidating.
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"
